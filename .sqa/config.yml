config:
  credentials: []
  project_repos:
    github.com/ARGOeu/argo-mon-library:
      branch: main
      repo: https://github.com/ARGOeu/argo-mon-library.git
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ARGOeu/argo-mon-library git:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-bronze-penguin.sh
        container: qc.acc_wiggy-wheat-falcon
  QC.Doc:
    repos:
      github.com/ARGOeu/argo-mon-library find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.dorky-celadon-hedgehog.sh
        container: qc.doc_muggy-azure-zebra
      github.com/ARGOeu/argo-mon-library git:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-cobalt-fousek.sh
        container: qc.doc_lumpy-chestnut-oyster
      github.com/ARGOeu/argo-mon-library markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.jumpy-sepia-mandrill.sh
        container: qc.doc_greasy-mauve-grasshopper
  QC.Lic:
    repos:
      github.com/ARGOeu/argo-mon-library licensee:
        commands:
        - /usr/bin/env sh .sqa/script.hazy-sapphire-ant.sh
        container: qc.lic_paltry-tan-heron
  QC.Sec:
    repos:
      github.com/ARGOeu/argo-mon-library bandit:
        commands:
        - /usr/bin/env sh .sqa/script.nippy-brass-whale.sh
        container: qc.sec_fuzzy-ultramarine-cockroach
  QC.Sty:
    repos:
      github.com/ARGOeu/argo-mon-library flake8:
        commands:
        - /usr/bin/env sh .sqa/script.pasty-teal-collie.sh
        container: qc.sty_smelly-viridian-burmese
  QC.Uni:
    repos:
      github.com/ARGOeu/argo-mon-library pytest:
        commands:
        - /usr/bin/env sh .sqa/script.snoopy-plum-coati.sh
        container: qc.uni_hazy-thistle-sponge
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-mon-library get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-orange-spaniel.sh
        container: qc.ver_shaky-cornflower-corgi
timeout: 5400
